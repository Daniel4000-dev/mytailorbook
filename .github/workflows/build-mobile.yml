name: Build Mobile (iOS & Android)

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build Android (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        if: ${{ (inputs.build_type || 'debug') == 'debug' }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK / Bundle
        if: ${{ inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android Debug APK Artifact
        if: ${{ (inputs.build_type || 'debug') == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: mystitchbook-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS Archive (${{ inputs.build_type || 'debug' }})
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS App (Unsigned Simulator/Device Archive for CI)
        run: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystitchbook-ios-build
          path: ios/App/build/Release-iphoneos/*.app
          if-no-files-found: warn
          retention-days: 14
