name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All secrets below point at the STAGING Supabase project, never production —
# CI must never be able to read or write real customer data.
env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  RLS_TENANT_A_EMAIL: ${{ secrets.RLS_TENANT_A_EMAIL }}
  RLS_TENANT_A_PASSWORD: ${{ secrets.RLS_TENANT_A_PASSWORD }}
  RLS_TENANT_A_SHOP_ID: ${{ secrets.RLS_TENANT_A_SHOP_ID }}
  RLS_TENANT_A_CUSTOMER_ID: ${{ secrets.RLS_TENANT_A_CUSTOMER_ID }}
  RLS_TENANT_A_ORDER_ID: ${{ secrets.RLS_TENANT_A_ORDER_ID }}
  RLS_TENANT_B_EMAIL: ${{ secrets.RLS_TENANT_B_EMAIL }}
  RLS_TENANT_B_PASSWORD: ${{ secrets.RLS_TENANT_B_PASSWORD }}
  RLS_TENANT_B_SHOP_ID: ${{ secrets.RLS_TENANT_B_SHOP_ID }}
  RLS_TENANT_B_CUSTOMER_ID: ${{ secrets.RLS_TENANT_B_CUSTOMER_ID }}
  RLS_TENANT_B_ORDER_ID: ${{ secrets.RLS_TENANT_B_ORDER_ID }}
  E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
  E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
  E2E_TEST_ORDER_ID: ${{ secrets.E2E_TEST_ORDER_ID }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit + RLS isolation tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Re-seed E2E fixtures (fresh known state)
        run: node scripts/seed-e2e-fixture.mjs

      - name: E2E smoke tests
        # playwright.config.ts's webServer builds and starts the app itself
        run: npm run test:e2e
