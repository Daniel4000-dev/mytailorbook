name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  typecheck-and-unit:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rls-isolation:
    name: RLS Tenant Isolation
    runs-on: ubuntu-latest
    needs: typecheck-and-unit
    # Requires STAGING_SUPABASE_* secrets configured on the repo — this job
    # proves cross-tenant isolation against the real staging Supabase project,
    # the actual go/no-go gate for the Phase 2 tenant redesign.
    if: ${{ secrets.STAGING_SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:rls

  e2e:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.STAGING_SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start server and run smoke tests
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/login > /dev/null && break
            sleep 2
          done
          PLAYWRIGHT_BASE_URL=http://localhost:3100 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
